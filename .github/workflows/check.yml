name: Check project
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [Asia/Kolkata, UTC] # B12: month boundaries, recurring dates and IDs must not depend on TZ
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run lint
